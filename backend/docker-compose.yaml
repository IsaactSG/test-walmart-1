version: '3.8'
services:
  backend:
    build: .
    ports:
      - "30001:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/walmart_db
    depends_on:
      - db
  db:
    image: postgres:13
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: walmart_db
    ports:
      - "5432:5432"